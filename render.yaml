services:
  - type: web
    name: ats-one-live
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FORCE_SECURE_COOKIE
        value: "1"
      - key: SUPABASE_BUCKET
        value: ats-one-private
